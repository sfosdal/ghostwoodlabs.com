<style>
  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url(/fonts/IBMPlexMono-Medium-Latin.woff2) format("woff2");
  }
  :root {
    --ground: #141a20;
    --ink: #ffffff;
    --ink-soft: #9ba2a9; /* white, five steps down, for the wordmark */
    --ink-dim: rgba(255,255,255,.44); /* the subcaption and footer */
    --gold: #e8791d; /* the brand's darker orange, the one used on white; #f08a33 is the lighter step */
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {
    /* the stack is centred on the viewport itself; the footer is taken out of flow so it cannot push it */
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 16px 76px; /* clears the two-line footer */
    text-align: center;
  }
  .mark {
    width: min(80vw, 64vh, 720px);
    height: auto;
    color: var(--ink);
  }
  .wordmark {
    margin-top: clamp(18px, 4vmin, 40px);
    font-family: var(--mono);
    font-weight: 500;
    font-size: clamp(18px, 4vmin, 44px);
    letter-spacing: .1em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
    padding-left: .1em; /* optical: tracking adds trailing space after the last letter */
  }
  .sub {
    margin-top: clamp(16px, 3.2vmin, 32px);
    font-size: clamp(12px, 1.8vmin, 18px);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    position: relative;
    height: 1.4em;
    width: 100%;
  }
  /* four captions stacked in one slot; each fades in for its quarter of a 16 s loop, no script */
  .sub span {
    position: absolute;
    left: 0; right: 0;
    opacity: 0;
    animation: rotate 16s infinite;
  }
  .sub span:nth-child(2) { animation-delay: 4s; }
  .sub span:nth-child(3) { animation-delay: 8s; }
  .sub span:nth-child(4) { animation-delay: 12s; }
  @keyframes rotate {
    0%, 25%, 100% { opacity: 0; }
    4%, 21%       { opacity: 1; }
  }
  .sub .still { opacity: 1; animation: none; }
  .back { margin-top: clamp(14px, 2.4vmin, 24px); font-size: clamp(12px, 1.8vmin, 18px); letter-spacing: .06em; }
  .back a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--ink-dim); padding-bottom: 2px; }
  .back a:hover, .back a:focus-visible { color: var(--ink); border-color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    .sub span { animation: none; }
    .sub span:first-child { opacity: 1; }
  }
  footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 16px 22px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .06em;
    line-height: 1.8;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-soft); text-decoration: none; } /* the contact address, one step brighter than the copyright */
  footer a:hover, footer a:focus-visible { color: var(--ink); }
</style>
