<style>
  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url(/fonts/IBMPlexMono-Medium-Latin.woff2) format("woff2");
  }
  :root {
    --ground: #141a20;
    --ink: #ffffff;
    --ink-mid: #c1c7cd;
    --ink-soft: #9ba2a9;
    --wordmark-size: clamp(18px, 4vmin, 44px);
    --gap: clamp(18px, 4vmin, 40px);
    --ink-dim: rgba(255,255,255,.5);
    --vh: 100vh;
    --gold: #e8791d;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @supports (height: 1dvh) { :root { --vh: 100dvh; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {

    background: var(--ground) radial-gradient(70vmax 70vmax at 50% 42%, #1b222a, var(--ground) 70%) no-repeat;
    color: var(--ink);
    font-family: var(--mono);
    position: relative;
    min-height: var(--vh);
  }
  main {

    --free: calc(var(--vh) - 92px - var(--mark-size) - var(--wordmark-size));
    --mark-size: max(48px, min(80vw, 64vh, 800px, var(--vh) - 92px - var(--gap) - var(--wordmark-size)));
    height: var(--vh);
    display: grid;
    grid-template-rows: max(0px, min(var(--free) / 2, 2 * (var(--free) - var(--gap)) / 3)) auto minmax(var(--gap), 1fr) auto 1fr 76px;
    justify-items: center;
    padding: 16px 16px 0;
    text-align: center;
  }
  .home {
    grid-row: 2;
    display: block;
    width: var(--mark-size);
    height: var(--mark-size);
    color: var(--ink);
    border-radius: 50%;
    outline-offset: 12px;
    transition: color .3s cubic-bezier(.4, 0, .2, 1);
  }
  .home:hover, .home:focus-visible { color: var(--gold); }
  .home:focus-visible { outline: 2px solid var(--gold); }
  .mark { display: block; width: 100%; height: 100%; }
  .wordmark {
    grid-row: 4;
    font-family: var(--mono);
    font-weight: 500;
    font-size: var(--wordmark-size);
    letter-spacing: .1em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--ink-mid);
    white-space: nowrap;
    padding-left: .1em;
  }
  .wordmark a { color: inherit; text-decoration: none; }
  .wordmark a:hover, .wordmark a:focus-visible { color: var(--ink); }

  @media (prefers-reduced-motion: no-preference) {
    .mark path {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1.02;
      animation: draw 1.1s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    .mark path:nth-child(1) { animation-delay: .2s; }
    .mark path:nth-child(2) { animation-delay: 1.1s; animation-duration: .5s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .wordmark { opacity: 0; animation: rise .6s 1.6s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  html[data-motion="reduce"] .mark path { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  html[data-motion="reduce"] .home { transition: none; }
  html[data-motion="reduce"] .wordmark { animation: none; opacity: 1; }
  footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 16px 22px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .06em;
    line-height: 1.8;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-soft); text-decoration: none; display: inline-block; padding: 12px 8px; margin: -12px -8px; }
  footer a:hover, footer a:focus-visible { color: var(--ink); }
</style>
</head>
