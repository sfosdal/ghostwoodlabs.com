  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 500;

  }
  :root {
    --ground: #141a20;
    --ink: #ffffff;
    --ink-mid: #c1c7cd;
    --ink-soft: #9ba2a9;
    --ink-dim: rgba(255,255,255,.5);
    --wordmark-size: clamp(18px, 4vmin, 44px);
    --gap: clamp(18px, 4vmin, 40px);
    --vh: 100vh;
    --gold: #e8791d;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @supports (height: 1dvh) { :root { --vh: 100dvh; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {

    background: var(--ground) radial-gradient(70vmax 70vmax at 50% 42%, #1b222a, var(--ground) 70%) no-repeat;
    color: var(--ink);
    font-family: var(--mono);
    position: relative;
    min-height: var(--vh);
  }
  main {

    --text-fixed: calc(var(--wordmark-size) + clamp(16px, 3.2vmin, 32px) + 1.4 * clamp(12px, 1.8vmin, 18px) + clamp(14px, 2.4vmin, 24px) + 1.4 * clamp(12px, 1.8vmin, 18px));
    --text-h: var(--text-fixed);
    --free: calc(var(--vh) - 92px - var(--mark-size) - var(--text-fixed));
    --room: calc(var(--vh) - 92px - var(--mark-size) - var(--text-h));
    height: var(--vh);
    display: grid;
    grid-template-rows: max(0px, min(var(--free) / 2, 2 * (var(--free) - var(--gap)) / 3, var(--room) - 2 * var(--gap))) auto minmax(var(--gap), 1fr) auto 1fr 76px;
    justify-items: center;
    padding: 16px 16px 0;
    text-align: center;

    --below: var(--wordmark-size);
    --mark-size: max(48px, min(80vw, 64vh, 800px, var(--vh) - 92px - var(--gap) - var(--below)));
  }
  .mark {
    grid-row: 2;
    width: var(--mark-size);
    height: var(--mark-size);
    color: var(--ink);
  }

  @media (prefers-reduced-motion: no-preference) {
    .mark .o { stroke-dasharray: 0 3; animation: 1.1s cubic-bezier(.4, 0, .2, 1) both; }
    .mark .o:nth-child(1) { animation-name: draw-left; }
    .mark .o:nth-child(2) { animation-name: draw-right; }
    @keyframes draw-left  { 0% { stroke-dasharray: 0 3; stroke-dashoffset: 0; opacity: 0; } 3% { opacity: 1; } 100% { stroke-dasharray: .5071 3; stroke-dashoffset: 0; opacity: 1; } }
    @keyframes draw-right { 0% { stroke-dasharray: 0 3; stroke-dashoffset: -1; opacity: 0; } 3% { opacity: 1; } 100% { stroke-dasharray: .4929 3; stroke-dashoffset: -.5071; opacity: 1; } }
    .mark path:nth-child(n+3) {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1.02;
      animation: draw .7s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    .mark path:nth-child(3)                             { animation-delay: .45s; }
    .mark path:nth-child(5), .mark path:nth-child(6)    { animation-delay: .55s; }
    .mark path:nth-child(7), .mark path:nth-child(8)    { animation-delay: .65s; }
    .mark path:nth-child(11), .mark path:nth-child(12)  { animation-delay: .75s; }
    .mark path:nth-child(9), .mark path:nth-child(10)   { animation-delay: .85s; }
    .mark path:nth-child(4)                             { animation-delay: .95s; }

    .wordmark { opacity: 0; animation: rise .6s 1.6s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .sub, .back { opacity: 0; animation: rise .6s 2.2s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  }
  .text { grid-row: 4; }
  .wordmark {
    font-family: var(--mono);
    font-weight: 500;
    font-size: var(--wordmark-size);
    letter-spacing: .1em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--ink-mid);
    white-space: nowrap;
    padding-left: .1em;
  }
  .sub.no-room { display: none; }

  .sub {
    margin: clamp(16px, 3.2vmin, 32px) auto 0;
    font-size: clamp(12px, 1.8vmin, 18px);
    letter-spacing: .18em;
    line-height: 1.4;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .back { margin-top: clamp(14px, 2.4vmin, 24px); font-size: clamp(12px, 1.8vmin, 18px); letter-spacing: .06em; line-height: 1.4; }
  .back a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--ink-dim); padding-bottom: 2px; }
  .back a:hover, .back a:focus-visible { color: var(--ink); border-color: var(--ink); }
  .wordmark a { color: inherit; text-decoration: none; }
  html[data-motion="reduce"] .sub, html[data-motion="reduce"] .back { animation: none; opacity: 1; }
  html[data-motion="reduce"] .mark path, html[data-motion="reduce"] .mark .o:nth-child(n) { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 1; }
  html[data-motion="reduce"] .wordmark { animation: none; opacity: 1; }
  footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 16px 22px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .06em;
    line-height: 1.8;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-soft); text-decoration: none; display: inline-block; padding: 12px 8px; margin: -12px -8px; }
  footer a:hover, footer a:focus-visible { color: var(--ink); }
</style>

<script>

  (function () {
    var main = document.querySelector('main'), text = document.querySelector('.text'), sub = document.querySelector('.sub');
    var forced = /[?&]motion=reduce(&|$)/.test(location.search), mq = matchMedia('(prefers-reduced-motion: reduce)');
    function layout() {
      var gap = Math.min(40, Math.max(18, .04 * Math.min(innerWidth, innerHeight)));
      sub.classList.remove('no-room');
      main.style.removeProperty('--below');
      main.style.setProperty('--text-h', text.offsetHeight + 'px');
      main.style.setProperty('--below', Math.min(text.offsetHeight + gap, innerHeight - 92 - gap - .48 * innerHeight) + 'px');
      if (text.getBoundingClientRect().bottom > innerHeight - 76) {
        sub.classList.add('no-room');
        main.style.setProperty('--text-h', text.offsetHeight + 'px');
        main.style.setProperty('--below', Math.min(text.offsetHeight + gap, innerHeight - 92 - gap - .48 * innerHeight) + 'px');
      }
    }
    layout();
    addEventListener('resize', layout);
    if (document.fonts) document.fonts.ready.then(layout);
    mq.addEventListener('change', function () {
      if (!forced) { if (mq.matches) document.documentElement.dataset.motion = 'reduce'; else document.documentElement.removeAttribute('data-motion'); }
      layout();
    });
  })();
