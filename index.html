  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url(fonts/IBMPlexMono-Medium-Latin.woff2) format("woff2");

  :root {
    --ground: #141a20;
    --ink: #ffffff;
    --ink-soft: #9ba2a9;
    --ink-dim: rgba(255,255,255,.44);
    --gold: #e8791d;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {

    background: var(--ground) radial-gradient(70vmax 70vmax at 50% 42%, #1b222a, var(--ground) 70%) no-repeat;
    color: var(--ink);
    font-family: var(--mono);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {

    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 16px 76px;
    text-align: center;
  }
  .mark {
    width: min(80vw, 64vh, 720px);
    height: auto;
    color: var(--ink);
  }

  @media (prefers-reduced-motion: no-preference) {
    .mark path {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1.02;
      animation: draw 1.1s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    .mark path + path { animation-duration: .9s; }
    .mark path:nth-child(2), .mark path:nth-child(3)   { animation-delay: .45s; }
    .mark path:nth-child(4), .mark path:nth-child(5)   { animation-delay: .55s; }
    .mark path:nth-child(6), .mark path:nth-child(7)   { animation-delay: .65s; }
    .mark path:nth-child(10), .mark path:nth-child(11) { animation-delay: .75s; }
    .mark path:nth-child(8), .mark path:nth-child(9)   { animation-delay: .85s; }

    .wordmark { opacity: 0; animation: rise .6s 1.6s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    p.sub span { animation-delay: 2.2s; }
    p.sub span:nth-child(2 ) { animation-delay: 5.2s; }
    p.sub span:nth-child(3 ) { animation-delay: 8.2s; }
    p.sub span:nth-child(4 ) { animation-delay: 11.2s; }
    p.sub span:nth-child(5 ) { animation-delay: 14.2s; }
    p.sub span:nth-child(6 ) { animation-delay: 17.2s; }
    p.sub span:nth-child(7 ) { animation-delay: 20.2s; }
    p.sub span:nth-child(8 ) { animation-delay: 23.2s; }
    p.sub span:nth-child(9 ) { animation-delay: 26.2s; }
    p.sub span:nth-child(10) { animation-delay: 29.2s; }
    p.sub span:nth-child(11) { animation-delay: 32.2s; }
    p.sub span:nth-child(12) { animation-delay: 35.2s; }
    p.sub span:nth-child(13) { animation-delay: 38.2s; }
    p.sub span:nth-child(14) { animation-delay: 41.2s; }
    p.sub span:nth-child(15) { animation-delay: 44.2s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  }
  .wordmark {
    margin-top: clamp(18px, 4vmin, 40px);
    font-family: var(--mono);
    font-weight: 500;
    font-size: clamp(18px, 4vmin, 44px);
    letter-spacing: .1em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
    padding-left: .1em;
  }
  .sub {
    margin-top: clamp(16px, 3.2vmin, 32px);
    font-size: clamp(12px, 1.8vmin, 18px);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    position: relative;
    height: 1.4em;
    width: 100%;
  }

  .sub span {
    position: absolute;
    left: 0; right: 0;
    opacity: 0;
    animation: rotate 45s infinite;
  }
  @keyframes rotate {
    0%        { opacity: 0; transform: translateY(3px); }
    1.067%, 5.600% { opacity: 1; transform: translateY(0); }
    6.667%, 100% { opacity: 0; transform: translateY(-3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sub span { animation: none; transform: none; }
    .sub span:first-child { opacity: 1; }
  }
  footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 16px 22px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .06em;
    line-height: 1.8;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover, footer a:focus-visible { color: var(--ink); }
