  :root {
    --ground: #141a20;
    --ink: #ffffff;
    --ink-mid: #c1c7cd;
    --ink-soft: #9ba2a9;
    --ink-dim: rgba(255,255,255,.44);
    --wordmark-size: clamp(18px, 4vmin, 44px);

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {

    background: var(--ground) radial-gradient(70vmax 70vmax at 50% 42%, #1b222a, var(--ground) 70%) no-repeat;

    font-family: var(--mono);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {

    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: 2fr auto minmax(clamp(18px, 4vmin, 40px), 1fr) auto 1fr 76px;
    justify-items: center;
    padding: 16px 16px 0;
    text-align: center;
  }
  .mark {
    grid-row: 2;

    --mark-size: max(48px, min(80vw, 64vh, 720px, 100vh - 92px - clamp(18px, 4vmin, 40px) - var(--wordmark-size)));
    --mark-size: max(48px, min(80vw, 64vh, 720px, 100dvh - 92px - clamp(18px, 4vmin, 40px) - var(--wordmark-size)));
    width: var(--mark-size);
    height: var(--mark-size);
    color: var(--ink);
  }

  @media (prefers-reduced-motion: no-preference) {
    .mark .o { stroke-dasharray: 0 3; animation: 1.1s cubic-bezier(.4, 0, .2, 1) both; }
    .mark .o:nth-child(1) { animation-name: draw-left; }
    .mark .o:nth-child(2) { animation-name: draw-right; }
    @keyframes draw-left  { 0% { stroke-dasharray: 0 3; stroke-dashoffset: 0; opacity: 0; } 3% { opacity: 1; } 100% { stroke-dasharray: .5071 3; stroke-dashoffset: 0; opacity: 1; } }
    @keyframes draw-right { 0% { stroke-dasharray: 0 3; stroke-dashoffset: -1; opacity: 0; } 3% { opacity: 1; } 100% { stroke-dasharray: .4929 3; stroke-dashoffset: -.5071; opacity: 1; } }
    .mark path:nth-child(n+3) {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1.02;
      animation: draw .7s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    .mark path:nth-child(3)                             { animation-delay: .45s; }
    .mark path:nth-child(5), .mark path:nth-child(6)    { animation-delay: .55s; }
    .mark path:nth-child(7), .mark path:nth-child(8)    { animation-delay: .65s; }
    .mark path:nth-child(11), .mark path:nth-child(12)  { animation-delay: .75s; }
    .mark path:nth-child(9), .mark path:nth-child(10)   { animation-delay: .85s; }
    .mark path:nth-child(4)                             { animation-delay: .95s; }

    .wordmark { opacity: 0; animation: rise .6s 1.6s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    p.sub span { animation-delay: 2.2s; }

  .text { grid-row: 4; }
  .wordmark {
    font-family: var(--mono);

  .sub.no-room, html[data-motion="reduce"] .sub.no-room { display: none; }
  .sub {
    margin-top: clamp(16px, 3.2vmin, 32px);
    font-size: clamp(12px, 1.8vmin, 18px);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    position: relative;
    height: 1.4em;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    overflow: hidden;
  }

  .sub b { font-weight: inherit; }
  .sub span {
    position: absolute;
    left: 0; right: 0;
    opacity: 0;
    animation: rotate 34.2s infinite;
  }
  .sub span:last-child { animation-name: rotate-last; }
  @keyframes rotate {
    0%           { opacity: 1; transform: translateX(100%); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
    1.754%       { opacity: 1; transform: none; }
    7.602%       { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.7, 0, .9, .5); }
    9.357%       { opacity: 1; transform: translateX(-100%); }
    9.358%, 100% { opacity: 0; transform: translateX(-100%); }
  }
  @keyframes rotate-last {
    0%           { opacity: 1; transform: translateX(100%); animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
    1.754%       { opacity: 1; transform: none; }
    24.561%      { opacity: 1; transform: none; animation-timing-function: ease-in-out; }
    29.240%, 100% { opacity: 0; transform: none; }
  }

  .sub .dot { font-style: normal; opacity: 0; animation: dot-in 34.2s infinite; }
  @keyframes dot-in { 0% { opacity: 0; } .877%, 28% { opacity: 1; } 28.01%, 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .sub { width: min(calc(11.88 * var(--wordmark-size)), 100vw - 32px); margin: clamp(16px, 3.2vmin, 32px) auto 0; height: auto; overflow: hidden; line-height: 1.7; display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); column-gap: 1.6em; }

    .sub span:last-child:not(.alone)::after { content: "\2026"; }
    .sub .dot { display: none; }
    .sub span.line-start::before { visibility: hidden; }
    .sub span { text-align: left; }
    .sub span.line-start { text-align: right; }
    .sub.stacked span { text-align: center; }

    .sub span.alone { display: contents; }
    .sub span.alone::before { content: none; }
    .sub span.alone b:first-child { text-align: right; transform: translateX(.41em); }
    .sub span.alone b:last-of-type { text-align: left; transform: translateX(-.41em); }
    .sub span.alone b:last-of-type::after { content: "\2026"; }
  }
  html[data-motion="reduce"] .sub { width: min(calc(11.88 * var(--wordmark-size)), 100vw - 32px); margin: clamp(16px, 3.2vmin, 32px) auto 0; height: auto; overflow: hidden; line-height: 1.7; display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); column-gap: 1.6em; }

  html[data-motion="reduce"] .sub .dot { display: none; }

  html[data-motion="reduce"] .sub span { text-align: left; }

  html[data-motion="reduce"] .sub span.alone { display: contents; }
  html[data-motion="reduce"] .sub span.alone::before { content: none; }
  html[data-motion="reduce"] .sub span.alone b:first-child { text-align: right; transform: translateX(.41em); }
  html[data-motion="reduce"] .sub span.alone b:last-of-type { text-align: left; transform: translateX(-.41em); }
  html[data-motion="reduce"] .sub span.alone b:last-of-type::after { content: "\2026"; }
  html[data-motion="reduce"] .mark path, html[data-motion="reduce"] .mark .o:nth-child(n) { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 1; }
  html[data-motion="reduce"] .wordmark { animation: none; opacity: 1; }

<script>

  (function () {
    var text = document.querySelector('.text'), sub = document.querySelector('.sub'), spans = sub.querySelectorAll('span'), n = spans.length;
    function textWidth(s) { var r = document.createRange(); r.selectNodeContents(s); return r.getBoundingClientRect().width; }
    function layout() {
      sub.classList.remove('no-room');
      columns();
      if (text.getBoundingClientRect().bottom > innerHeight - 76) sub.classList.add('no-room');
    }
    function columns() {
      if (getComputedStyle(sub).display !== 'grid') return;
      var gap = parseFloat(getComputedStyle(sub).columnGap) || 0, cols, widest = 0;
      spans.forEach(function (s) { s.classList.remove('alone'); widest = Math.max(widest, textWidth(s)); });
      for (cols = n - n % 2; cols > 1; cols -= 2) {
        if (widest <= (sub.clientWidth - gap * (cols - 1)) / cols) break;
      }
      if (cols < 1) cols = 1;
      sub.style.setProperty('--cols', cols);
      sub.classList.toggle('stacked', cols === 1);
      var alone = cols > 1 && (n - 1) % cols === 0;
      spans.forEach(function (s, i) {
        s.classList.toggle('line-start', i % cols === 0);
        s.classList.toggle('alone', alone && i === n - 1);
      });
    }
    layout();
    addEventListener('resize', layout);
    if (document.fonts) document.fonts.ready.then(layout);
    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', layout);
  })();
</script>
